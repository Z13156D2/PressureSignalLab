[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-monitor-toolkit"
version = "0.1.0"
description = "Desktop sensor monitoring demos, serial acquisition, and voltage data visualization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "pyserial>=3.5",
]

[project.optional-dependencies]
qt = ["PyQt5>=5.15"]

[project.scripts]
sensor-monitor = "sensor_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
